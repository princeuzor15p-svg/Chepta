<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>chepta® — Account Suspended</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="chepta.css" />
<style>
  body {
    margin: 0; background: var(--bg, #080d17); color: var(--txt, #eaf0fb);
    font-family: Manrope, system-ui, sans-serif; display: flex;
    align-items: center; justify-content: center; height: 100dvh;
    padding: 20px; box-sizing: border-box; text-align: center;
  }
  .sus-card {
    width: 100%; max-width: 400px; background: var(--surface, #131c2e);
    border: 1px solid var(--line, rgba(255,255,255,.08)); border-radius: 24px;
    padding: 36px 24px; box-shadow: var(--shadow, 0 24px 60px -24px rgba(0,0,0,.8));
    display: flex; flex-direction: column; align-items: center;
  }
  .sus-icon {
    width: 84px; height: 84px; border-radius: 50%;
    background: rgba(255, 93, 108, 0.12); border: 2px solid rgba(255, 93, 108, 0.35);
    color: var(--danger, #ff5d6c); display: grid; place-items: center;
    font-size: 40px; margin-bottom: 22px;
    box-shadow: 0 0 35px rgba(255, 93, 108, 0.22);
  }
  .sus-card h2 {
    font-family: Sora, sans-serif; font-size: 22px; margin: 0 0 10px; color: #fff;
  }
  .sus-card p {
    color: var(--muted, #8d9ab4); font-size: 14px; line-height: 1.55; margin: 0 0 26px;
  }
  .sus-btn {
    width: 100%; border: 0; border-radius: 14px; padding: 14px;
    font: 700 15px Manrope, sans-serif; cursor: pointer;
    background: var(--grad, linear-gradient(135deg, #12d6a4, #37e6ff));
    color: #04231c; transition: transform .15s, opacity .15s; margin-bottom: 12px;
  }
  .sus-btn:active { transform: scale(.98); }
  .sus-btn[disabled] { opacity: 0.7; cursor: not-allowed; }
  .sus-btn.ghost {
    background: transparent; color: var(--muted, #8d9ab4);
    border: 1px solid var(--line, rgba(255,255,255,.08));
  }
</style>
</head>
<body>

<div class="sus-card">
  <div class="sus-icon">
    <i class="fa-solid fa-xmark"></i>
  </div>
  <h2>Account Suspended</h2>
  <p>Your account <b id="susUsername">@user</b> has been suspended due to a terms or policy violation.</p>
  
  <button class="sus-btn" id="reviewBtn">Request Review</button>
  <button class="sus-btn ghost" id="susLogoutBtn">Sign Out</button>
</div>

<script type="module">
import { requireAuth, logout, db, collection, addDoc, serverTimestamp, esc, toast } from "./chepta.js";

let USER_PROF = null;

requireAuth((user, profile) => {
  USER_PROF = profile;
  const uname = profile.username || profile.displayName || "user";
  document.getElementById("susUsername").textContent = "@" + uname;
});

document.getElementById("susLogoutBtn").onclick = () => logout();

document.getElementById("reviewBtn").onclick = async () => {
  if (!USER_PROF) return;
  const btn = document.getElementById("reviewBtn");
  btn.disabled = true;
  btn.textContent = "Sending request...";
  
  try {
    await addDoc(collection(db, "reports"), {
      by: USER_PROF.uid,
      byName: USER_PROF.username || USER_PROF.displayName || "user",
      type: "suspension review",
      snippet: `User @${USER_PROF.username || USER_PROF.displayName} requested an account suspension review.`,
      status: "open",
      createdAt: serverTimestamp()
    });

    btn.textContent = "Review Requested";
    btn.style.background = "rgba(18,214,164,0.15)";
    btn.style.color = "#12d6a4";
    btn.style.border = "1px solid rgba(18,214,164,0.3)";
    toast("Review request submitted to admins.");
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Request Review";
    toast("Failed to submit review request.");
  }
};
</script>
</body>
</html>
