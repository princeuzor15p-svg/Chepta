<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>chepta® — Requests</title>
<meta name="description" content="Accept or decline chat requests on chepta." />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="chepta.css" />
<style>
  .nav a { position: relative; }
  .nav .nbadge {
    position: absolute; top: 6px; right: calc(50% - 16px); background: #ff4d4d; color: #fff;
    font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 10px; min-width: 16px; text-align: center;
    border: 2px solid var(--surface, #131c2e);
  }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead" id="drawerUser"></div>
  <nav>
    <a href="dashboard.html"><i class="fa-solid fa-comments"></i> Chats</a>
    <a href="feed.html"><i class="fa-solid fa-rss"></i> Feed</a>
    <a href="requests.html"><i class="fa-solid fa-user-plus"></i> Requests</a>
    <a href="people.html"><i class="fa-solid fa-magnifying-glass"></i> Find people</a>
    <a href="groups.html"><i class="fa-solid fa-users"></i> Groups</a>
    <a href="profile.html"><i class="fa-solid fa-user"></i> My profile</a>
    <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
    <a href="terms.html"><i class="fa-solid fa-file-lines"></i> Terms &amp; Privacy</a>
    <a href="#" id="logoutBtn" class="danger"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log out</a>
  </nav>
</aside>

<div class="page">
  <header class="top">
    <button class="icobtn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    <h1>Requests</h1>
  </header>

  <div class="pad" style="display:flex;gap:8px">
    <button class="btn sm" id="tIn" style="flex:1">Received</button>
    <button class="btn sm ghost" id="tOut" style="flex:1">Sent</button>
  </div>
  <div id="list"><div class="skel"></div><div class="skel"></div></div>
</div>

<nav class="nav">
  <a href="dashboard.html" data-nav="chats"><i class="fa-solid fa-comments"></i>Chats</a>
  <a href="feed.html" data-nav="feed"><i class="fa-solid fa-rss"></i>Feed<span class="nbadge hide" id="feedBadge">0</span></a>
  <a href="people.html" data-nav="people"><i class="fa-solid fa-magnifying-glass"></i>People</a>
  <a href="requests.html" data-nav="requests"><i class="fa-solid fa-user-plus"></i>Requests<span class="nbadge hide" id="reqBadge">0</span></a>
  <a href="profile.html" data-nav="profile"><i class="fa-solid fa-user"></i>Profile</a>
</nav>

<script type="module">
import {
  db, requireAuth, mountShell, $, esc, avatar, timeAgo, toast, dmId, getUser,
  collection, query, where, onSnapshot, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp,
} from "./chepta.js";

let ME, PROF, tab = "in", IN = [], OUT = [];

$("tIn").onclick = () => { tab = "in"; flip(); };
$("tOut").onclick = () => { tab = "out"; flip(); };
function flip() {
  $("tIn").className = "btn sm" + (tab === "in" ? "" : " ghost");
  $("tOut").className = "btn sm" + (tab === "out" ? "" : " ghost");
  render();
}

requireAuth((user, profile) => {
  ME = user; PROF = profile;
  mountShell("requests", profile);
  onSnapshot(query(collection(db, "requests"), where("to", "==", user.uid), where("status", "==", "pending")),
    async (s) => { 
      IN = await hydrate(s, "from"); 
      render(); 
      const b = $('reqBadge');
      if (s.size) { b.textContent = s.size; b.classList.remove('hide'); } else { b.classList.add('hide'); }
    }, () => {});

  onSnapshot(query(collection(db, "requests"), where("from", "==", user.uid), where("status", "==", "pending")),
    async (s) => { OUT = await hydrate(s, "to"); render(); }, () => {});

  onSnapshot(query(collection(db, 'stories')), (s) => {
    const feedBadge = $('feedBadge');
    if (s.size > 0) {
      feedBadge.textContent = s.size;
      feedBadge.classList.remove('hide');
    } else {
      feedBadge.classList.add('hide');
    }
  }, () => {});
});

async function hydrate(snap, field) {
  return Promise.all(snap.docs.map(async (d) => {
    const r = { id: d.id, ...d.data() };
    r.user = await getUser(r[field]);
    return r;
  }));
}

function render() {
  const rows = tab === "in" ? IN : OUT;
  const box = $("list");
  if (!rows.length) {
    box.innerHTML = `<div class="empty"><i class="fa-regular fa-paper-plane"></i>
      ${tab === "in" ? "No requests waiting for you." : "You haven't sent any requests."}</div>`;
    return;
  }
  box.innerHTML = rows.map((r) => `
    <div class="row">
      <div class="avwrap">${avatar(r.user)}</div>
      <div class="grow"><div class="name">@${esc(r.user.username)}</div>
        <div class="sub">${tab === "in" ? "Wants to chat with you" : "Waiting for a reply"} · ${timeAgo(r.createdAt)}</div></div>
      <div style="display:flex;gap:7px">
        ${tab === "in"
          ? `<button class="btn sm" data-ok="${r.id}"><i class="fa-solid fa-check"></i></button>
             <button class="btn sm danger" data-no="${r.id}"><i class="fa-solid fa-xmark"></i></button>`
          : `<button class="btn sm danger" data-cancel="${r.id}">Cancel</button>`}
      </div>
    </div><div class="sep"></div>`).join("");
  box.querySelectorAll("[data-ok]").forEach((b) => b.onclick = () => accept(b.dataset.ok));
  box.querySelectorAll("[data-no]").forEach((b) => b.onclick = () => decline(b.dataset.no, "rejected"));
  box.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = () => decline(b.dataset.cancel, "cancelled"));
}

async function accept(id) {
  const r = IN.find((x) => x.id === id); if (!r) return;
  try {
    await setDoc(doc(db, "users", ME.uid, "friends", r.from), { uid: r.from, since: serverTimestamp() });
    await setDoc(doc(db, "users", r.from, "friends", ME.uid), { uid: ME.uid, since: serverTimestamp() });
    const cid = dmId(ME.uid, r.from);
    const cref = doc(db, "chats", cid);
    if (!(await getDoc(cref)).exists()) {
      await setDoc(cref, { members: [ME.uid, r.from], isGroup: false, unread: {}, createdAt: serverTimestamp() });
    }
    await updateDoc(doc(db, "requests", id), { status: "accepted" });
    await deleteDoc(doc(db, "requests", id));
    toast("Request accepted — chat unlocked");
    location.href = "chat.html?c=" + cid;
  } catch (e) { toast(e.message); }
}
async function decline(id) {
  try { await deleteDoc(doc(db, "requests", id)); toast("Removed"); }
  catch (e) { toast(e.message); }
}
</script>
</body>
</html>
